# Render Blueprint - Déploiement automatique
# Plus d'infos: https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: absences-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: absences
    healthCheckPath: /api/

  # Frontend Web
  - type: web
    name: absences-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && EXPO_PUBLIC_BACKEND_URL=https://gestion-absences-ello-1.onrender.com npx expo export --platform web
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
