# Render Blueprint - Déploiement automatique
# Plus d'infos: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: absences-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false  # À configurer manuellement avec votre URL MongoDB Atlas
      - key: DB_NAME
        value: absences
    healthCheckPath: /api/
